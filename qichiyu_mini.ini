custom_proxy_group=🐸 手动切换`select`.*
custom_proxy_group=🏡 家宽节点`select`(家宽|家庭)

; 修改高速节点：简化匹配，只要求包含（香港|日本|新加坡）之一
custom_proxy_group=🛩️ 高速节点`select`(香港|HK|HongKong|日本|JP|Japan|新加坡|SG|Singapore)

custom_proxy_group=🕊️便宜节点`select`(0\.5|0\.5倍|0\.5x)

; 修改香港节点：匹配（香港|HK|HongKong|Hong Kong），移除复杂否定预查
custom_proxy_group=🇭🇰 香港节点`select`(香港|HK|HongKong|Hong Kong)

; 修改日本节点：匹配（日本|JP|Japan）
custom_proxy_group=🇯🇵 日本节点`select`(日本|JP|Japan)

; 修改新加坡节点：匹配（新加坡|SG|Singapore）
custom_proxy_group=🇸🇬 加坡节点`select`(新加坡|SG|Singapore)

; 修改美国节点：匹配（美国|美|US|United States）
custom_proxy_group=🇺🇲 美国节点`select`(美国|美|US|United States)

; 修改其他地区：取反，不包含香港、日本、新加坡、美国的关键词
custom_proxy_group=🌐 其他地区`select`^(?!.*(香港|HK|HongKong|日本|JP|Japan|新加坡|SG|Singapore|美国|美|US|United States)).*

; 修改故障转移组：简化为直接匹配关键词，去掉 url-test 中的未转义点号
custom_proxy_group=🔯 香港故转`fallback`(香港|HK|HongKong|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 日本故转`fallback`(日本|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 加坡故转`fallback`(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50

; 保留原有星标组但简化正则（去除 !!GROUPID 等非标准语法，如有需要可保留原意）
custom_proxy_group=⭐ 香港故转`fallback`(香港|HK|HongKong|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⭐ 日本故转`fallback`(日本|JP|Japan)`http://www.gstatic.com/generate_204`300,,50

; 负载均衡组简化
custom_proxy_group=🍃 香港均衡`load-balance`(香港|HK|HongKong|Hong Kong)`http://www.gstatic.com/generate_204`300,,50

; 自动选择组保持不变
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 奈飞节点组保持不变
custom_proxy_group=🎥 奈飞节点`select`(NF|奈飞|解锁|Netflix|NETFLIX|Media)

;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true
